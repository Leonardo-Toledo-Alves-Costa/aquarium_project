appId: com.aquarium.app
productName: Aquarium
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
# Módulo de captura de áudio por programa (native/build.cmd gera o .exe).
extraResources:
  - from: native/bin/aquarium-audio.exe
    to: aquarium-audio.exe
asar: true
npmRebuild: false
win:
  target: portable
  artifactName: Aquarium-${version}.exe
